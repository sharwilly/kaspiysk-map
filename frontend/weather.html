<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Погода | Открытый Каспийск</title>


<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/weather.css">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">


</head>



<body data-page="weather">


<div id="header-container"></div>



<main class="weather-page">



<!-- =========================
     MAIN WEATHER CARD
========================= -->


<section id="weatherHero" class="weather-hero">


    <div class="weather-header">


        <div class="weather-city">

            📍 Каспийск

        </div>


        <div id="weatherUpdated" class="weather-updated">

            Сейчас

        </div>


    </div>



    <div id="weatherIcon" class="weather-icon">

        ☀️

    </div>



    <div id="weatherTemp" class="weather-temp">

        --

    </div>



    <div id="weatherDescription" class="weather-description">

        Загрузка...

    </div>



    <div id="weatherFeels" class="weather-feels">

    </div>



</section>






<!-- =========================
     DETAILS
========================= -->


<section class="weather-details-grid">


<div class="weather-detail-card">


<div class="detail-icon">
💧
</div>


<div>

<span>
Влажность
</span>


<strong id="humidity">
--
</strong>


</div>


</div>





<div class="weather-detail-card">


<div class="detail-icon">
🌬
</div>


<div>

<span>
Ветер
</span>


<strong id="wind">
--
</strong>


</div>


</div>





<div class="weather-detail-card">


<div class="detail-icon">
🧭
</div>


<div>

<span>
Направление
</span>


<strong id="direction">
--
</strong>


</div>


</div>





<div class="weather-detail-card">


<div class="detail-icon">
📈
</div>


<div>

<span>
Давление
</span>


<strong id="pressure">
--
</strong>


</div>


</div>


</section>








<!-- =========================
     HOURLY
========================= -->


<section class="weather-section">


<div class="section-title">

<h2>
Почасовой прогноз
</h2>


</div>



<div id="hourlyForecast" class="hourly-list">


</div>



</section>








<!-- =========================
     DAILY
========================= -->


<section class="weather-section">


<div class="section-title">

<h2>
Прогноз на 7 дней
</h2>


</div>




<div id="dailyForecast" class="daily-list">


</div>




</section>









<!-- =========================
     EXTRA CITY INFO
========================= -->


<section class="weather-section">


<div class="section-title">

<h2>
Дополнительно
</h2>

</div>




<div class="extra-grid">



<div class="extra-card">


<div>
🌅
</div>


<span>
Восход
</span>


<strong id="sunrise">
--
</strong>


</div>





<div class="extra-card">


<div>
🌇
</div>


<span>
Закат
</span>


<strong id="sunset">
--
</strong>


</div>






<div class="extra-card">


<div>
⚠️
</div>


<span>
Предупреждения
</span>


<strong>
Нет
</strong>


</div>




</div>



</section>







</main>






<script src="js/weather.js"></script>

<script src="js/header.js"></script>



</body>

</html>
