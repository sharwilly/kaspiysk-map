<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Погода | Открытый Каспийск</title>


<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/weather.css">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">


</head>


<body data-page="weather">


<div id="header-container"></div>



<main class="weather-page">



<section class="weather-main-card">


<div class="weather-location">

📍 Каспийск

</div>



<div id="weatherIcon" class="weather-icon-large">

🌤

</div>



<div id="weatherTemp" class="weather-temperature">

--

</div>



<div id="weatherDescription" class="weather-description">

Загрузка...

</div>



<div id="weatherFeels" class="weather-feels">

</div>



<div class="weather-details">


<div>

💧

<span>

Влажность

</span>

<strong id="humidity">

--

</strong>

</div>



<div>

🌬

<span>

Ветер

</span>

<strong id="wind">

--

</strong>

</div>



<div>

📈

<span>

Давление

</span>

<strong id="pressure">

--

</strong>

</div>



</div>



</section>






<section class="weather-section">


<h2>
Почасовой прогноз
</h2>


<div id="hourlyForecast" class="hourly-list">

</div>


</section>






<section class="weather-section">


<h2>
Прогноз на 7 дней
</h2>


<div id="dailyForecast" class="daily-list">

</div>


</section>






<section class="weather-section">


<h2>
Солнце
</h2>


<div class="sun-card">


<div>

🌅

<span>
Восход
</span>

<strong id="sunrise">

--

</strong>

</div>



<div>

🌇

<span>
Закат
</span>

<strong id="sunset">

--

</strong>

</div>


</div>


</section>




</main>





<script src="js/weather.js"></script>

<script src="js/header.js"></script>



</body>

</html>
