<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта Каспийска — Открытый Каспийск</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/problems.css">
</head>
<body>

<div id="header-container"></div>

<main id="container">
    <section class="map-wrapper">
        <div id="map"></div>

        <div id="mapFilters">
            <div class="map-filter-group" aria-label="Период обращений">
                <button type="button" class="map-filter date-filter active" data-date-filter="all">Все обращения</button>
                <button type="button" class="map-filter date-filter" data-date-filter="30days">За 30 дней</button>
            </div>

            <div class="map-filter-group" aria-label="Тип обращения">
                <button type="button" class="map-filter type-filter active" data-filter="all">Все</button>
                <button type="button" class="map-filter type-filter" data-filter="подтопление">💧 Подтопления</button>
                <button type="button" class="map-filter type-filter" data-filter="яма">🕳 Ямы</button>
                <button type="button" class="map-filter type-filter" data-filter="мусор">🗑 Мусор</button>
                <button type="button" class="map-filter type-filter" data-filter="освещение">💡 Освещение</button>
                <button type="button" class="map-filter type-filter" data-filter="собака">🐕 Собаки</button>
                <button type="button" class="map-filter type-filter" data-filter="другое">❗ Другое</button>
                <button type="button" class="map-filter type-filter" data-filter="outage">⚡ Электричество</button>
            </div>
        </div>
    </section>

    <aside id="panel">
        <h2>Новое обращение</h2>
        <label>Тип обращения</label>
        <div class="problem-types">
            <button type="button" class="type-button" data-type="подтопление">💧 <span>Подтопление</span></button>
            <button type="button" class="type-button" data-type="яма">🕳 <span>Яма</span></button>
            <button type="button" class="type-button" data-type="мусор">🗑 <span>Мусор</span></button>
            <button type="button" class="type-button" data-type="освещение">💡 <span>Освещение</span></button>
            <button type="button" class="type-button" data-type="собака">🐕 <span>Бездомная собака</span></button>
            <button type="button" class="type-button" data-type="другое">❗ <span>Другое</span></button>
            <button type="button" class="type-button" data-type="outage">⚡ <span>Электричество</span></button>
        </div>
        <input type="hidden" id="problemType" value="">

        <label for="problemAddress">Адрес <span class="optional">(необязательно)</span></label>
        <input type="text" id="problemAddress" placeholder="Например: ул. Ленина, 24" autocomplete="off">
        <button type="button" id="findAddress">🔎 Найти адрес</button>
        <button type="button" id="myLocation">📍 Моё местоположение</button>
        <div id="addressResults"></div>

        <label for="problemDescription">Описание</label>
        <textarea id="problemDescription" rows="5" placeholder="Опишите проблему или собаку"></textarea>

        <label>Фотографии <span class="optional">(до 3)</span></label>
        <label class="photo-button">
            📷 Добавить фото
            <input type="file" id="photos" multiple accept="image/*">
        </label>
        <div id="photoPreview"></div>

        <button type="button" id="saveProblem">🚀 Отправить обращение</button>
        <div id="serverNotice" class="server-notice hidden">
            ⏳ Сервер запускается...<br>
            Первая отправка может занять до минуты.<br>
            Пожалуйста, не закрывайте страницу.
        </div>
    </aside>
</main>

<div id="photoViewer" class="photo-viewer">
    <button type="button" id="closeViewer" aria-label="Закрыть">✕</button>
    <button type="button" id="prevPhoto" aria-label="Предыдущая фотография">‹</button>
    <img id="viewerImage" src="" alt="Фотография">
    <button type="button" id="nextPhoto" aria-label="Следующая фотография">›</button>
</div>

<script>
    const API_URL = "https://kaspiysk-map-1.onrender.com";
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="js/weather-widget.js"></script>
<script src="js/header.js"></script>
<script src="js/problems.js"></script>

<script>
    // Фильтр периода обращений.
    // Основной JS карты уже загружен выше, поэтому здесь расширяем его без изменения логики типов.
    let currentProblemDateFilter = "all";

    function problemMatchesDateFilter(problem) {
        if (currentProblemDateFilter === "all") return true;
        if (!problem.created_at) return false;

        const createdAt = new Date(problem.created_at);
        if (Number.isNaN(createdAt.getTime())) return false;

        const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        return createdAt.getTime() >= cutoff;
    }

    function applyProblemFilters() {
        problemMarkers.forEach(item => {
            const visibleByType = currentMapFilter === "all" || currentMapFilter === item.type;
            const visibleByDate = item.problem ? problemMatchesDateFilter(item.problem) : true;
            const visible = visibleByType && visibleByDate;

            if (visible) {
                if (!map.hasLayer(item.marker)) item.marker.addTo(map);
            } else if (map.hasLayer(item.marker)) {
                map.removeLayer(item.marker);
            }
        });

        // Отключения пока не ограничиваем периодом — они остаются отдельным типом карты.
        outageMarkers.forEach(marker => {
            const visible = currentMapFilter === "all" || currentMapFilter === "outage";
            if (visible) {
                if (!map.hasLayer(marker)) marker.addTo(map);
            } else if (map.hasLayer(marker)) {
                map.removeLayer(marker);
            }
        });
    }

    // Заменяем функцию применения фильтра, которую вызывает существующий problems.js.
    applyMapFilter = applyProblemFilters;

    async function loadProblemsForDateFilter() {
        try {
            const response = await fetch(`${problemsApi}/problems`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const problems = await response.json();

            problemMarkers.forEach(item => {
                if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
            });
            problemMarkers = [];

            problems.forEach(problem => {
                if (problem.latitude == null || problem.longitude == null) return;

                const marker = createProblemMarker(problem);
                marker.bindPopup(buildProblemPopup(problem));
                problemMarkers.push({
                    marker,
                    type: problem.type,
                    problem
                });
            });

            applyProblemFilters();
        } catch (error) {
            console.error("❌ Ошибка загрузки всех обращений:", error);
        }
    }

    document.querySelectorAll(".date-filter").forEach(button => {
        button.addEventListener("click", async function () {
            document.querySelectorAll(".date-filter").forEach(btn => btn.classList.remove("active"));
            this.classList.add("active");
            currentProblemDateFilter = this.dataset.dateFilter;

            // Данные уже загружены полностью, поэтому переключение происходит мгновенно.
            applyProblemFilters();
        });
    });

    // Загружаем все обращения вместо прежнего набора только активных.
    loadProblemsForDateFilter();
</script>

<script>
    // Оставляем обязательную атрибуцию OpenStreetMap, но убираем префикс "Leaflet".
    document.querySelector('.leaflet-control-attribution a[href*="leafletjs.com"]')?.remove();
</script>
</body>
</html>
