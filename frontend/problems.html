<!-- Leaflet карта -->
<link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link rel="stylesheet" href="css/problems.css">
<link rel="stylesheet" href="css/common.css">


<!-- =========================================================
     КАРТА
========================================================= -->

<div id="map"></div>


<!-- =========================================================
     ФИЛЬТРЫ КАРТЫ
========================================================= -->

<div id="mapFilters">

    <button
        type="button"
        class="map-filter active"
        data-filter="all"
    >
        Все
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="подтопление"
    >
        💧 Подтопления
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="яма"
    >
        🕳 Ямы
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="мусор"
    >
        🗑 Мусор
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="освещение"
    >
        💡 Освещение
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="другое"
    >
        ❗ Другое
    </button>


    <button
        type="button"
        class="map-filter"
        data-filter="outage"
    >
        ⚡ Электричество
    </button>

</div>



<!-- =========================================================
     ПАНЕЛЬ НОВОГО ОБРАЩЕНИЯ
========================================================= -->

<div id="panel">

    <h2>
        Новое обращение
    </h2>


    <!-- Тип проблемы -->

    <label>
        Тип проблемы
    </label>


    <div class="problem-types">


        <button
            type="button"
            class="type-button"
            data-type="подтопление"
        >
            💧 Подтопление
        </button>


        <button
            type="button"
            class="type-button"
            data-type="яма"
        >
            🕳 Яма
        </button>


        <button
            type="button"
            class="type-button"
            data-type="мусор"
        >
            🗑 Мусор
        </button>


        <button
            type="button"
            class="type-button"
            data-type="освещение"
        >
            💡 Освещение
        </button>


        <button
            type="button"
            class="type-button"
            data-type="другое"
        >
            ❗ Другое
        </button>


    </div>


    <input
        type="hidden"
        id="problemType"
        value=""
    >



    <!-- Адрес -->

    <label>
        Адрес (необязательно):
    </label>


    <input
        type="text"
        id="problemAddress"
        placeholder="Например: ул. Ленина, 24"
    >


    <button
        type="button"
        id="findAddress"
    >
        Найти адрес
    </button>


    <button
        id="myLocation"
        type="button"
    >
        📍 Моё местоположение
    </button>


    <div id="addressResults"></div>



    <br>



    <!-- Описание -->

    <label>
        Описание
    </label>


    <textarea
        id="problemDescription"
        rows="5"
        placeholder="Опишите проблему"
    ></textarea>



    <!-- Фотографии -->

    <label>
        Фотографии (до 3):
    </label>


    <label class="photo-button">

        📷 Добавить фото


        <input
            type="file"
            id="photos"
            multiple
            accept="image/*"
        >

    </label>


    <div id="photoPreview"></div>



    <!-- Отправка -->

    <button
        type="button"
        id="saveProblem"
    >
        🚀 Отправить обращение
    </button>

</div>



<!-- =========================================================
     УВЕДОМЛЕНИЕ О ЗАПУСКЕ СЕРВЕРА
========================================================= -->

<div
    id="serverNotice"
    class="server-notice hidden"
>

    ⏳ Сервер запускается...
    <br>

    Первая отправка может занять до минуты.
    <br>

    Пожалуйста, не закрывайте страницу.

</div>



<!-- =========================================================
     ПРОСМОТР ФОТОГРАФИЙ
========================================================= -->

<div id="photoViewer">

    <button
        id="closeViewer"
        type="button"
        aria-label="Закрыть"
    >
        ✕
    </button>


    <button
        id="prevPhoto"
        type="button"
        aria-label="Предыдущая фотография"
    >
        ‹
    </button>


    <img
        id="viewerImage"
        alt="Фотография проблемы"
    >


    <button
        id="nextPhoto"
        type="button"
        aria-label="Следующая фотография"
    >
        ›
    </button>

</div>
