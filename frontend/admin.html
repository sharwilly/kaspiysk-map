<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Kaspiysk Map - Админ</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

<h1>Панель администрации</h1>

<input id="adminPassword" type="password">

<button onclick="loginAdmin()">
    Войти
</button>

<button onclick="logoutAdmin()">
    Выйти
</button>

<div class="tabs">

    <button
        id="activeTab"
        class="tab-button active"
        onclick="loadActive()">

        Активные
        (<span id="activeCount"></span>)

    </button>

    <button
        id="outagesTab"
        class="tab-button"
        onclick="loadOutages()">

        Коммунальные
        (<span id="outagesCount"></span>)

    </button>

    <button
        id="archiveTab"
        class="tab-button"
        onclick="loadArchive()">

        Архив
        (<span id="archiveCount"></span>)

    </button>

</div>


<hr>

<div id="filters"></div>

<div id="problems">
    Загрузка обращений...
</div>

<script src="js/config.js"></script>
<script src="js/header.js"></script>

</body>
</html>
