name: Truck GPS history poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: truck-gps-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poll truck GPS source
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60             "https://kaspiysk-map-1.onrender.com/trucks/poll"
          echo
