name: Patch truck source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Use published truck snapshot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch API to use gps-data snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/trucks-init.js')
          s=p.read_text()
          marker='async function latestTrucks() {'
          fn="""async function publishedTruckSnapshot() {
              const response = await fetch('https://raw.githubusercontent.com/sharwilly/kaspiysk-map/gps-data/trucks-latest.json', {
                  headers: { Accept: 'application/json', 'User-Agent': 'OpenKaspiysk-Demo/1.0' },
                  signal: AbortSignal.timeout(8000)
              });
              if (!response.ok) throw new Error(`GPS snapshot HTTP ${response.status}`);
              const payload = await response.json();
              if (!Array.isArray(payload.trucks)) throw new Error('Invalid GPS snapshot');
              return payload.trucks;
          }

          """
          if 'async function publishedTruckSnapshot()' not in s:
              s=s.replace(marker, fn+marker, 1)
          old='''            const sourceError = null;
            const trucks = await latestTrucks();'''
          new='''            let sourceError = null;
            let trucks;
            try {
                trucks = await publishedTruckSnapshot();
            } catch (error) {
                sourceError = error.message;
                trucks = await latestTrucks();
            }'''
          if old not in s: raise SystemExit('route marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/trucks-init.js
          git commit -m "Use published truck snapshot"
          git push origin HEAD:main
