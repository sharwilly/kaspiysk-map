name: Garbage truck GPS collector

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: garbage-truck-gps-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm install --omit=dev

      - name: Collect GPS snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node trucks-cron.js

      - name: Verify production API has fresh GPS
        working-directory: .
        run: |
          curl -fsS --max-time 30 https://kaspiysk-map-1.onrender.com/trucks -o /tmp/trucks.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/trucks.json'))
          trucks=p.get('trucks', [])
          fresh=[t for t in trucks if t.get('fresh')]
          print(f"API count={len(trucks)}, fresh={len(fresh)}, storage={p.get('storage')}")
          assert p.get('storage') == 'postgresql', p
          assert fresh, p
          PY
