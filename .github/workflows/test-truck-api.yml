name: Test truck API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, 'Remove truck API test') }}
    runs-on: ubuntu-latest
    steps:
      - name: Query production truck API
        run: |
          curl -fsS --max-time 30 -D /tmp/headers.txt https://kaspiysk-map-1.onrender.com/trucks -o /tmp/body.json
          cat /tmp/headers.txt
          python - <<'PY'
          import json
          p=json.load(open('/tmp/body.json'))
          print(json.dumps(p, ensure_ascii=False, indent=2))
          assert isinstance(p.get('trucks'), list), p
          PY
