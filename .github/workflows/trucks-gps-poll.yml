name: Poll garbage truck GPS

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll GPS source through production API
        run: |
          curl --fail --silent --show-error --retry 3 \
            --retry-delay 5 \
            https://kaspiysk-map.onrender.com/trucks/poll
